name: Breeze Dev Android arm64-v8a Debug Build

# 仅手动触发的开发用构建：只产出 Android arm64-v8a Debug APK，不创建 Release。
# 不使用任何仓库 Secret：跳过 git-crypt 解密（无上游签名密钥），
# debug 构建使用 AGP 默认生成的 debug keystore 签名，不上传 Sentry 符号表。
# 注意：为省时间未编译 waifu2x CLI，此 APK 中 RealSR 超分功能不可用。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-v8a-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 释放空间 (Nuclear Mode)
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/codeql
          sudo mkdir -p /usr/local/lib/android/sdk
          sudo chown -R $USER:$USER /usr/local/lib/android 
          docker system prune -a -f
          sudo apt-get clean

      - name: 设置 Java 21 & SDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: 设置 Flutter (FVM)
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
          export PATH="$PATH:$HOME/.pub-cache/bin"
          fvm install && fvm use --force
          echo "$GITHUB_WORKSPACE/.fvm/flutter_sdk/bin" >> $GITHUB_PATH

      - name: 安装 Rust 工具链 (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust

      - name: 读取 NDK 版本配置
        id: ndk-config
        run: |
          NDK_VER=$(grep "ndkVersion" android/app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "ndk_version=$NDK_VER" >> $GITHUB_OUTPUT

      - name: 缓存 Android NDK
        uses: actions/cache@v5
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ steps.ndk-config.outputs.ndk_version }}
          key: ${{ runner.os }}-android-ndk-${{ steps.ndk-config.outputs.ndk_version }}

      - name: 安装 Android NDK
        run: yes | sdkmanager "ndk;${{ steps.ndk-config.outputs.ndk_version }}"

      - name: 设置 NDK 环境变量
        run: |
          NDK_VER=${{ steps.ndk-config.outputs.ndk_version }}
          ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VER"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # 没有上游签名密钥，无法执行 git-crypt unlock。锁定状态下这两个文件是
      # 二进制密文，而 build.gradle.kts 在配置阶段会无条件 Properties.load
      # key.properties（随机字节可能导致解析异常）。直接删除使 gradle 走
      # "无 key.properties" 分支；debug buildType 不引用 release 签名配置。
      - name: 移除 git-crypt 加密的签名文件
        run: rm -f android/key.properties android/Breeze-key.keystore

      - name: 接受 Android Licenses
        run: yes | fvm flutter doctor --android-licenses || true

      - name: 拉取 Flutter 依赖
        run: fvm flutter pub get

      # 不经 build_apk.dart（其 debug 模式硬编码 arm64+x64 双架构），
      # 直接指定仅 arm64；NDK/bindgen 环境由 hook/build.dart 按目标架构注入。
      - name: 构建 arm64-v8a Debug APK
        run: fvm flutter build apk --debug --target-platform=android-arm64

      - name: 上传工件
        uses: actions/upload-artifact@v6
        with:
          name: android-arm64-v8a-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

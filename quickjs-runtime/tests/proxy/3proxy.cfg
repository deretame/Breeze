# 3proxy 对打测试配置（docs/proxy_test_plan.md §1.2）
# 启动：third_party/3proxy/3proxy.exe tests/proxy/3proxy.cfg（cwd = 仓库根）
# 日志：代理侧证据（断言请求确实经过代理；*.log 已 gitignore）

log tests/proxy/3proxy.log D
logformat "L%d-%m-%Y %H:%M:%S %N %p %E %U %C:%c %R:%r %O %I %h %T"

# ---- 实例 1：SOCKS5 无认证，端口 11080 ----
auth none
socks -p11080 -i127.0.0.1

# ---- 实例 2：SOCKS5 user/pass（RFC 1929），端口 11081 ----
flush
auth strong
users alice:CL:s3cret
allow alice
socks -p11081 -i127.0.0.1

# ---- 实例 3：HTTP 代理无认证（含 CONNECT），端口 13128 ----
flush
auth none
proxy -p13128 -i127.0.0.1

# ---- 实例 4：HTTP 代理 Basic 认证，端口 13129 ----
flush
auth strong
users bob:CL:passw0rd
allow bob
proxy -p13129 -i127.0.0.1

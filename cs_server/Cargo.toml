[package]
name = "breeze_cs_server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
brotli = "8.0.4"
base64 = "0.22.1"
ferrous-opencc = { version = "0.4.0", features = ["japanese-conversion"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2",
    "json",
    "stream",
    "charset",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "cookies",
    "multipart",
    "rustls",
    "system-proxy",
    "socks",
] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
rquickjs_playground = { path = "../rust/rquickjs_playground" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
futures-util = "0.3.31"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower-http = { version = "0.6.6", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["v4"] }
